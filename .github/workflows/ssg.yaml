name: Build and Deploy SSG Site

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # каждый час — подхватывает новые статьи из WP
  repository_dispatch:
    types: [wp-publish]

jobs:
  build-ssg:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Disable git autocrlf
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build static site (Astro SSG)
        shell: pwsh
        env:
          WP_GRAPHQL_TIMEOUT_MS: "30000"
        run: |
          # WPGraphQL отдаёт через раз: сборка делает десятки запросов, и один
          # таймаут ронял весь деплой. Повторяем сборку целиком, не больше двух раз.
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            npm run build 2>&1 | Tee-Object -FilePath build.log
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "build attempt $attempt failed, retrying"
            Start-Sleep -Seconds 10
          }
          # Логи деплоя не читаются без прав: последние строки уходят в аннотацию.
          foreach ($line in (Get-Content build.log -Tail 15)) { Write-Host "::error::$line" }
          exit 1

      - name: Create ZIP archive
        working-directory: dist
        run: Compress-Archive -Path * -DestinationPath ..\ssg-site.zip

      - name: Deploy to FTP (sync)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_LOGIN }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.FTP_PATH }}
          local-dir: dist/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ssg-site.zip
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
name: Build and Deploy SSG Site

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # каждый час — подхватывает новые статьи из WP
  repository_dispatch:
    types: [wp-publish]

jobs:
  build-ssg:
    runs-on: windows-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Disable git autocrlf
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build static site (Astro SSG)
        shell: pwsh
        env:
          WP_GRAPHQL_TIMEOUT_MS: "30000"
          # У домена есть AAAA, а у раннеров GitHub нет IPv6: Node выбирает
          # IPv6 первым и получает «fetch failed». Просим IPv4.
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: |
          # WPGraphQL отдаёт через раз: сборка делает десятки запросов, и один
          # таймаут ронял весь деплой. Повторяем сборку целиком, не больше двух раз.
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            npm run build 2>&1 | Tee-Object -FilePath build.log
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "build attempt $attempt failed, retrying"
            Start-Sleep -Seconds 10
          }
          # Логи деплоя не читаются без прав: последние строки уходят в аннотацию.
          foreach ($line in (Get-Content build.log -Tail 15)) { Write-Host "::error::$line" }
          exit 1

      - name: Report build failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Логи деплоя не читаются без прав: на падении открываем issue с хвостом лога.
        run: |
          $body = if (Test-Path build.log) { Get-Content build.log -Tail 60 | Out-String } else { "build.log not created" }
          if ($body.Length -gt 60000) { $body = $body.Substring($body.Length - 60000) }
          $payload = @{
            title = "CI build error $env:GITHUB_RUN_ID"
            body  = "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n`n``````n$body`n``````"
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/issues" `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" } `
            -Body $payload -ContentType "application/json"

      - name: Create ZIP archive
        working-directory: dist
        run: Compress-Archive -Path * -DestinationPath ..\ssg-site.zip

      - name: Deploy to FTP (sync)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_LOGIN }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.FTP_PATH }}
          local-dir: dist/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ssg-site.zip
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
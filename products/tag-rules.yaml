    robot: manipulator
  - kind: model
    match: jetmax
    tags: "манипуляторы, манипуляция, ros 2, открытое железо"
    robot: manipulator
  - kind: model
    match: learm
    tags: "манипуляторы, манипуляция, открытое железо"

# --- Hiwonder (hiwonder.com), 2026-10-28: образовательные роботы ---
#
# Shopify-фид отдаёт 85 товаров, но большинство — сервоприводы, модули и
# крепёж; их отсекает ACCESSORY_KEYWORDS. Ниже модели, которые являются
# роботами. Явное model-правило важнее эвристики «kit»: AiArm и xArm UNO
# называются kit, но это манипуляторы, а не запчасти.
  - kind: brand
    match: Hiwonder
    tags: "роботы, открытое железо"

  - kind: model
    match: aquasense 2 pro
    tags: "автономность, навигация"
  - kind: model
    match: aquasense pro robotic
    tags: "автономность, навигация"
  - kind: model
    match: iskim ultra robotic
    tags: "автономность, навигация"
  # Loona (keyirobot.com): домашний робот-компаньон, две модели.
  - kind: model
    match: loona deskmate
    tags: "роботы"
  - kind: model
    match: loona petbot
    tags: "роботы"
  # Mercury (elephantrobotics.com): «Wheeled Humanoid Robot Series» — гуманоид
  # на колёсной базе.
  - kind: model
    match: mercury wheeled humanoid
    tags: "гуманоиды, роботы"
    robot: humanoid
  # myCobot 280 All-in-one Suite — настольный кобот с открытым ПО.
  - kind: model
    match: mycobot 280 2023
    tags: "манипуляторы, коботы, открытое железо, исследования"
    robot: cobot
  # myPalletizer All-in-one Suite — четырёхосный манипулятор.
  - kind: model
    match: mypalletizer all in one
    tags: "манипуляторы"
    robot: manipulator
  # LIMO Cobot — мобильная платформа с манипулятором.
  - kind: model
    match: limo cobot
    tags: "манипуляторы, автономность, навигация"
    robot: amr
  # MarsCat / metaCat — бионические роботы-коты.
  - kind: model
    match: bionic pet cat

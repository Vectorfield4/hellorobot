# Правила тегования товаров: как модель превращается в тег статьи.
#
# Тег — причина, по которой товар вообще есть в каталоге: читатель открыл статью
# про гуманоидов и должен увидеть гуманоида. Поэтому теги назначает не человек
# на глаз, а `shop-tagmap` по этим правилам.
#
# kind: model — правило для конкретной модели, побеждает остальные;
# kind: brand — теги бренда; kind: type — теги типа робота
# (humanoid, quadruped, cobot, manipulator, amr, exoskeleton, drone, soft).
#
# match сравнивается с нормализованным именем и sku (lowercase, ё→е, без пунктуации).
# tags — теги блога через запятую. Тег, которого нет в статьях, отбрасывается.
version: 1
rule:
  - kind: model
    match: unitree g1
    tags: "гуманоиды, роботы, исследования"
  - kind: model
    match: unitree go2
    tags: "навигация, автономность, роботы"
  - kind: model
    match: unitree h1
    tags: "гуманоиды, роботы"
  - kind: model
    match: boston dynamics spot
    tags: "навигация, автономность, биоинспирированная робототехника"
  - kind: model
    match: boston dynamics atlas
    tags: "гуманоиды, роботы"
  - kind: model
    match: reachy
    tags: "гуманоиды, манипуляция, открытое железо, исследования"
  - kind: model
    match: openmanipulator
    tags: "манипуляторы, манипуляция, открытое железо"
  - kind: model
    match: mgrip
    tags: "мягкая робототехника, тактильность, манипуляция"
  - kind: model
    match: mir
    tags: "складская логистика, навигация, автономность"
  - kind: model
    match: vision 60
    tags: "оборонная робототехника, автономность, навигация"
  - kind: model
    match: ziggy
    tags: "электромобили, автономность, навигация"
  - kind: model
    match: ur5
    tags: "коботы, манипуляторы, промышленная автоматизация"
  - kind: model
    match: ur30
    tags: "коботы, манипуляторы, промышленная автоматизация"
  - kind: model
    match: kr 6
    tags: "промышленная робототехника, манипуляторы, промышленная автоматизация"
  - kind: model
    match: franka
    tags: "манипуляторы, манипуляция, исследования, тактильность"
  - kind: brand
    match: Unitree
    tags: "роботы"
  - kind: brand

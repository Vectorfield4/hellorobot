# Стартовый allowlist брендов для магазина.
#
# `shop-vendors init` копирует этот файл в `data/<host>/sellers.yaml` при первом
# прогоне. Настоящий список живёт в `data/` и в git не попадает: это внутренний
# сигнал доверия, а не публичная страница.
#
# kind: brand — производитель, seller — продавец/дистрибьютор.
# flagship — премиальные модели бренда, comma-список. Нужны, когда на сайте
# бренда нет публичной цены: премиальность решается по этому полю, а не по цене.
